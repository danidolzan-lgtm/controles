<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563EB"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="sync.js" data-app="checklist-b3m"></script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{overflow-x:hidden}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.voltar{display:inline-block;margin:12px 16px 0;font:600 14px system-ui,sans-serif;color:inherit;opacity:.7;text-decoration:none}</style></head><body><a class="voltar" href="index.html">← Meus Controles</a><title>Check-list B3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: check-list único do dia (feito de manhã), janelas das sessões, 4 perguntas, veredito, calendário seg–sex 13/10–17/12. */
:root{
  --bg:#EEF3FC; --surface:#FFFFFF; --line:#DDE4F2; --fg:#13203B; --muted:#58668A;
  --accent:#2563EB; --accent-soft:#DCE7FF; --win:#15803D; --win-soft:#DCFCE7; --loss:#E11D48; --loss-soft:#FFE4EA; --part:#D97706; --part-soft:#FEF3C7;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#16213A; --line:#2A3A5C; --fg:#E6EDFA; --muted:#9AA9C7; --accent:#60A5FA; --accent-soft:#1E3A8A;
  --win:#4ADE80; --win-soft:#123D26; --loss:#FB7185; --loss-soft:#4A1A28; --part:#FBBF24; --part-soft:#3F2A06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#16213A; --line:#2A3A5C; --fg:#E6EDFA; --muted:#9AA9C7; --accent:#60A5FA; --accent-soft:#1E3A8A;
  --win:#4ADE80; --win-soft:#123D26; --loss:#FB7185; --loss-soft:#4A1A28; --part:#FBBF24; --part-soft:#3F2A06; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
h2::first-letter{text-transform:uppercase}
.sub,.status{color:var(--muted);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.tabs{display:flex;gap:6px}
.tabs button{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 14px;cursor:pointer;flex:1}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs .h{display:block;font-family:var(--f-num);font-weight:400;font-size:.75rem;opacity:.8}
.q{display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.q p{margin:0;max-width:60ch}
.yn{display:flex;gap:6px}
.yn button{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 18px;cursor:pointer}
.yn button.on.s{background:var(--win);border-color:var(--win);color:var(--surface)}
.yn button.on.n{background:var(--loss);border-color:var(--loss);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{cursor:default}
.verdict{border-radius:9px;padding:14px;display:grid;gap:2px;background:var(--bg)}
.verdict b{font-family:var(--f-display);font-size:1.3rem}
.verdict.ok{background:var(--win-soft)} .verdict.ok b{color:var(--win)}
.verdict.no{background:var(--loss-soft)} .verdict.no b{color:var(--loss)}
.verdict span{font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:7px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.month{display:grid;gap:8px}
.month h3{font-family:var(--f-display);font-size:.95rem;margin:0}
.month h3::first-letter{text-transform:uppercase}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{font-size:.68rem;color:var(--muted);text-align:center;text-transform:uppercase}
.day{appearance:none;font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:7px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-family:var(--f-num);font-size:.85rem;cursor:pointer;position:relative}
.day.blank{visibility:hidden}
.day.we{opacity:.35;cursor:default}
.day.full{background:var(--win);border-color:var(--win);color:var(--surface)}
.day.half{background:var(--part-soft);border-color:var(--part)}
.day.none{background:var(--loss-soft);border-color:var(--loss)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--accent) inset}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.lock{font-size:.82rem;color:var(--muted);font-style:italic}
.jan{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.88rem;border-radius:8px;padding:8px 12px;background:var(--accent-soft)}
.jan b{font-family:var(--f-num)}
.jan .ag{font-weight:600;border-radius:999px;padding:2px 10px;font-size:.78rem}
.jan .ag{border:1px solid var(--line)}
.jan .ag.in{background:var(--win);color:var(--surface)} .jan .ag.out{background:var(--loss-soft);color:var(--loss)}
.wrap>*{min-width:0}
img,svg{max-width:100%}
</style>
<div class="wrap">
  <div class="top">
    <div><h1>Check-list B3</h1><div class="sub">WIN e WDO · M2 · uma vez por dia, de manhã, antes da 1ª sessão. Quatro "sim" liberam o dia.</div></div>
    <div class="status" id="status">Carregando…</div>
  </div>
  <div class="panel">
    <h2 id="dTitle">Hoje</h2>
    <div class="jan" id="jan"></div>
    <div id="qs"></div>
    <div class="verdict" id="verdict"></div>
    <div class="lock" id="lock" hidden></div>
    <div class="actions" id="acts"><button type="button" class="btn primary" id="bSave">Salvar</button><button type="button" class="btn" id="bCancel">Fechar sem salvar</button></div>
  </div>
  <div class="panel">
    <div id="cal" style="display:grid;gap:18px"></div>
    <div class="legend"><span><i style="background:var(--win)"></i>dia liberado</span><span><i style="background:var(--loss-soft)"></i>não liberado</span></div>
  </div>
</div>
<script>
const START="2026-10-14", END="2026-12-17", LS="checklistB3m.v1";
// check-list feito UMA vez por dia, de manhã, antes da 1ª sessão. Horários fixos (não mudam em 02/11).
const SESS=[{id:"manha",nome:"Manhã"},{id:"tarde",nome:"Tarde"}];
const JAN={manha:["09:45","11:15"],tarde:["14:00","15:30"]};
// Manhã: começa depois dos dados dos EUA das 09:30 (até 01/11). Às 10:25–10:45 tem pausa TODO dia:
// até 01/11 é a abertura de Nova York; a partir de 02/11 são os dados dos EUA. Tarde: longe de tudo, menos FOMC.
const EVT={
  "2026-10-28":[{n:"FOMC, juros dos EUA",de:"14:55",ate:"15:45",pula:{tarde:"FOMC 15:00"}}],
  "2026-11-02":[{n:"Finados, B3 fechada",de:"00:00",ate:"23:59",pula:{manha:"B3 fechada",tarde:"B3 fechada"}}],
  "2026-11-20":[{n:"Consciência Negra, B3 fechada",de:"00:00",ate:"23:59",pula:{manha:"B3 fechada",tarde:"B3 fechada"}}],
  "2026-11-26":[{n:"feriado nos EUA",de:"00:00",ate:"23:59",pula:{tarde:"EUA fechado, volume fraco"}}],
  "2026-12-09":[{n:"FOMC, juros dos EUA",de:"15:00",ate:"16:00",pula:{tarde:"FOMC 16:00"}}]
};
function pausas(ds){const p=[{n:ds>="2026-11-02"?"dados dos EUA":"abertura de Nova York",de:"10:25",ate:"10:45"}];if(ds<"2026-11-02")p.push({n:"dados dos EUA das 11:00, só se houver notícia forte",de:"10:55",ate:"11:15"});return p.concat((EVT[ds]||[]).filter(e=>e.de!=="00:00"))}
function pulos(ds){const o={};(EVT[ds]||[]).forEach(e=>Object.assign(o,e.pula||{}));return o}
const pausasTxt=ds=>pausas(ds).map(p=>p.de+"–"+p.ate+" ("+p.n+")").join(" e ");
const sessTxt=()=>SESS.map(s=>s.nome+" "+JAN[s.id].join("–")).join(" · ");
const QS=[
  {id:"hor",k:"Horários e notícias",t:ds=>{const pl=pulos(ds),k=Object.keys(pl);return "Abri o calendário (alto impacto · USD e BRL: IPCA, Copom, Payroll, CPI, FOMC), vou operar só nas sessões ("+sessTxt()+"), respeitando a pausa das "+pausasTxt(ds)+(k.length?", vou PULAR "+k.map(x=>SESS.find(s=>s.id===x).nome+" ("+pl[x]+")").join(", "):"")+" e, em dia de Payroll ou CPI, só começo 30 min depois da notícia?"}},
  {id:"op",k:"Operacional",t:"Vou entrar só em Respiro, Virada, Muralha (pavio ou engolfo), Giro ou Armadilha no M2, com médias 9, 21 e 50 espaçadas, volume da vela de sinal acima da média, stop técnico dentro do limite (WIN 150 pts · WDO 5 pts), o outro ativo não indo forte no mesmo sentido (WIN × WDO) e todos os filtros do manual conferidos?"},
  {id:"ger",k:"Gerenciamento",t:"Contratos do meu degrau no Progresso, ordem com stop e alvo de 2x o stop junto (OCO), no máximo 2 operações em cada sessão (manhã e tarde), uma aberta por vez (nunca WIN e WDO juntos), e encerro a sessão no 1º loss?"},
  {id:"men",k:"Mentalidade",t:"Estou calmo, sem vontade de recuperar nada, e aceito o stop se ele vier?"}
];
let data={}, db=null, sel=null, draft=null;
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const fmt=ds=>new Date(ds+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
const isWE=ds=>{const g=new Date(ds+"T12:00:00").getDay();return g===0||g===6};
const ok1=s=>s&&QS.every(q=>s[q.id]===true);
// dias antigos tinham um check-list por sessão: conta como liberado se alguma sessão foi liberada
const ok=r=>!!r&&(ok1(r)||SESS.some(s=>ok1(r[s.id]))||["manha","tarde"].some(k=>ok1(r[k])));
const respondido=r=>!!r&&QS.some(q=>typeof r[q.id]==="boolean"||["manha","tarde"].some(k=>r[k]&&typeof r[k][q.id]==="boolean"));
const editable=ds=>ds===today();
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r)data=r}catch(e){}}
function pick(ds){sel=ds;draft=JSON.parse(JSON.stringify(data[ds]||{}));render()}
function render(){
  $("dTitle").textContent=fmt(sel);
  const can=editable(sel), cur=draft;
  const box=$("qs");box.innerHTML="";
  QS.forEach(q=>{
    const d=document.createElement("div");d.className="q";
    d.innerHTML="<span class='k'>"+q.k+"</span><p>"+(typeof q.t==="function"?q.t(sel):q.t)+"</p>";
    const yn=document.createElement("div");yn.className="yn";
    [["s","Sim",true],["n","Não",false]].forEach(([c,l,v])=>{
      const b=document.createElement("button");b.type="button";b.textContent=l;b.className=c+(cur[q.id]===v?" on":"");b.disabled=!can;
      b.setAttribute("aria-pressed",cur[q.id]===v);
      b.onclick=()=>{draft[q.id]=v;render()};
      yn.appendChild(b)});
    d.appendChild(yn);box.appendChild(d);
  });
  const v=$("verdict"), answered=QS.every(q=>typeof cur[q.id]==="boolean");
  if(ok1(cur)||(!answered&&ok(cur))){v.className="verdict ok";v.innerHTML="<b>Liberado para operar hoje</b><span>Manhã 09:45–11:15 (pausa 10:25–10:45) e tarde 14:00–15:30. No máximo 2 operações por sessão, sempre com stop e alvo 2x; deu loss, encerra a sessão.</span>"}
  else if(answered){v.className="verdict no";v.innerHTML="<b>Não operar hoje</b><span>Algum item ficou em não. Fecha a plataforma e volta amanhã.</span>"}
  else{v.className="verdict";v.innerHTML="<b>Responda as 4 perguntas</b><span>Faça uma vez, de manhã, antes da 1ª sessão. Quatro sim liberam o dia.</span>"}
  $("acts").hidden=!can; $("lock").hidden=can;
  $("lock").textContent= sel<today()?"Dia encerrado. Só visualização.":"Esse dia ainda não chegou. O check-list abre no próprio dia.";
  drawJan();drawCal();
}
function drawJan(){
  const mm=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
  const d=new Date(), m=d.getHours()*60+d.getMinutes(), hoje=sel===today()&&!isWE(today());
  const pz=pausas(sel).find(p=>m>=mm(p.de)&&m<mm(p.ate)), pl=pulos(sel);
  let h="<span style='flex-basis:100%'>Sessões de hoje (horário fixo):</span>";
  SESS.forEach(s=>{const [a,b]=JAN[s.id],dentro=hoje&&m>=mm(a)&&m<mm(b),pu=pl[s.id];
    h+="<span class='ag "+(pu?"out":dentro?(pz?"out":"in"):"")+"' style='"+(pu||dentro?"":"background:var(--surface);color:var(--fg)")+"'>"+s.nome+" <b>"+a+"–"+b+"</b>"+(pu?" · PULAR ("+pu+")":dentro?(pz?" · ⛔ PAUSA até "+pz.ate:" · agora"):"")+"</span>"});
  const pt=pausasTxt(sel);
  if(pt)h+="<span style='flex-basis:100%;color:var(--loss);font-weight:600;font-size:.82rem'>⛔ Pausa dentro das sessões hoje: "+pt+"</span>";
  h+="<span class='hint' style='flex-basis:100%;color:var(--muted);font-size:.78rem'>Fixo: manhã 09:45–11:15 e tarde 14:00–15:30, com pausa todo dia às 10:25–10:45. Payroll e CPI: manhã só 30 min depois da notícia.</span>";
  $("jan").innerHTML=h;
}
setInterval(()=>{if($("jan"))drawJan()},60000);
function drawCal(){
  const cal=$("cal");cal.innerHTML="";const t=today();
  let cur=new Date(+START.slice(0,4),+START.slice(5,7)-1,1,12);const end=new Date(END+"T12:00:00");
  while(cur<=end){
    const y=cur.getFullYear(),m=cur.getMonth();
    const box=document.createElement("div");box.className="month";
    box.innerHTML="<h3>"+cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+"</h3><div class='dow'><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>";
    const g=document.createElement("div");g.className="grid";
    const sd=new Date(START+"T12:00:00"), d0=(y===sd.getFullYear()&&m===sd.getMonth())?sd.getDate():1;
    for(let i=0;i<new Date(y,m,d0).getDay();i++){const b=document.createElement("div");b.className="day blank";g.appendChild(b)}
    for(let d=d0;d<=new Date(y,m+1,0).getDate();d++){
      const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const b=document.createElement("button");b.type="button";b.textContent=d;
      if(ds>END)break;
      if(ds<START){b.className="day blank";g.appendChild(b);continue}
      const rec=data[ds];
      let cls="day";
      if(isWE(ds)){cls+=" we";b.disabled=true}
      else if(respondido(rec)) cls+= ok(rec)?" full":" none";
      if(ds===t)cls+=" today"; if(ds===sel)cls+=" sel";
      b.className=cls; b.setAttribute("aria-label",fmt(ds));
      if(!isWE(ds)) b.onclick=()=>pick(ds);
      g.appendChild(b);
    }
    box.appendChild(g);cal.appendChild(box);
    cur=new Date(y,m+1,1,12);
  }
}
$("bCancel").onclick=()=>pick(sel);
$("bSave").onclick=async()=>{
  if(!editable(sel))return;
  data[sel]=JSON.parse(JSON.stringify(draft));render();
  if(db){try{await db.doc("dias/"+sel).set(data[sel]);$("status").textContent="Salvo";window.ui&&ui.done($("bSave"),"Salvo")}catch(e){$("status").textContent="Não salvou. Tente de novo.";window.ui&&ui.toast("Não salvou. Tente de novo.",1)}}
  else{try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}$("status").textContent="Salvo neste aparelho";window.ui&&ui.done($("bSave"),"Salvo")}
};
load();
{const t=today();sel=t<START?START:t>END?END:t}
draft=JSON.parse(JSON.stringify(data[sel]||{}));render();$("status").textContent="Conectando…";
(async()=>{
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){$("status").textContent="Salvando neste aparelho";return}
  db.collection("dias").onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=d.data()});data=m;
    if(!editable(sel)) draft=JSON.parse(JSON.stringify(data[sel]||{}));
    else if(!Object.keys(draft).length) draft=JSON.parse(JSON.stringify(data[sel]||{}));
    render();$("status").textContent="Sincronizado";
  },()=>{$("status").textContent="Sem conexão com o salvamento"});
})();
</script>
</body></html>
