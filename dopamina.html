<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F5C7A"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="sync.js" data-app="dopamina-b3"></script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{overflow-x:hidden}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.voltar{display:inline-block;margin:12px 16px 0;font:600 14px system-ui,sans-serif;color:inherit;opacity:.7;text-decoration:none}</style></head><body><a class="voltar" href="index.html">← Meus Controles</a><title>Tabela de Dopamina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: placar no topo, check-in de hoje, calendário dom–sáb de 09/10 a 17/12. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --line:#D5DCDA; --fg:#16201D; --muted:#5D6B67;
  --accent:#1F5C7A; --win:#1E7A4C; --win-soft:#DDF0E5; --loss:#B23A35; --loss-soft:#F6E0DE;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201E; --line:#2A3532; --fg:#E4ECE9; --muted:#93A29E;
  --accent:#6FB2D3; --win:#5BC98E; --win-soft:#173327; --loss:#EC7A73; --loss-soft:#3A1E1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201E; --line:#2A3532; --fg:#E4ECE9; --muted:#93A29E;
  --accent:#6FB2D3; --win:#5BC98E; --win-soft:#173327; --loss:#EC7A73; --loss-soft:#3A1E1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}
h2{font-family:var(--f-display);font-size:1rem;margin:0}
.sub,.status{color:var(--muted);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.score div{display:grid;gap:2px}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-family:var(--f-num);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pos{color:var(--win)} .neg{color:var(--loss)}
.check{display:grid;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1;min-width:120px}
.btn.w.on{background:var(--win);border-color:var(--win);color:var(--surface)}
.btn.l.on{background:var(--loss);border-color:var(--loss);color:var(--surface)}
.btn.save{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{display:grid;gap:8px}
.month h3{font-family:var(--f-display);font-size:.95rem;margin:0}
.month h3::first-letter{text-transform:uppercase}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{font-size:.68rem;color:var(--muted);text-align:center;text-transform:uppercase}
.day{appearance:none;font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:7px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-family:var(--f-num);font-size:.85rem;cursor:pointer}
.day.blank{visibility:hidden}
.day.w{background:var(--win);border-color:var(--win);color:var(--surface)}
.day.l{background:var(--loss);border-color:var(--loss);color:var(--surface)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--accent) inset}
.day[disabled]{cursor:default;opacity:.55}
.hint{font-size:.8rem;color:var(--muted)}
.pctp{display:grid;gap:8px}
.pcth{display:flex;justify-content:space-between;align-items:baseline}
.pcth .big{font-size:2.4rem}
.pctp{border-width:2px}
.bar{height:12px;border-radius:6px;background:var(--loss-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--win);width:100%}
.wrap>*{min-width:0}
img,svg{max-width:100%}
</style>
<div class="wrap">
  <div class="top">
    <div><h1>Tabela de Dopamina</h1><div class="sub">09/10 a 17/12/2026 · verde acertei, vermelho errei</div></div>
    <div class="status" id="status">Carregando…</div>
  </div>
  <div class="panel pctp">
    <div class="pcth"><span class="lbl" style="font-size:.8rem">% de disciplina até 17/12</span><span class="big" id="sPct">100%</span></div>
    <div class="bar" aria-hidden="true"><i id="sBar"></i></div>
    <div class="hint" id="sPctTxt"></div>
  </div>
  <div class="panel score">
    <div><span class="lbl">Acertei</span><span class="big pos" id="sW">0</span></div>
    <div><span class="lbl">Errei</span><span class="big neg" id="sL">0</span></div>
    <div><span class="lbl">Sequência</span><span class="big" id="sSeq">0</span></div>
    <div><span class="lbl">Melhor</span><span class="big" id="sBest">0</span></div>
  </div>
  <div class="panel check">
    <h2 id="cTitle">Check-in</h2>
    <div class="btns">
      <button type="button" class="btn w" id="bW">Acertei</button>
      <button type="button" class="btn l" id="bL">Errei</button>
    </div>
    <div class="btns"><button type="button" class="btn save" id="bSave">Salvar</button><button type="button" class="btn" id="bCancel">Fechar sem salvar</button></div>
    <div class="hint" id="cHint"></div>
  </div>
  <div class="panel" id="cal" style="display:grid;gap:18px"></div>
</div>
<script>
const START="2026-10-09", END="2026-12-17", LS="dopaminaB3.v1";
let marks={}, db=null, sel=null, draft=null;
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const fmt=ds=>new Date(ds+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
function editable(ds){const t=today();return ds>=START&&ds<=END&&ds<=t&&(ds===t||!marks[ds])}
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r)marks=r}catch(e){}}
function stats(){
  const keys=Object.keys(marks).sort();
  let w=0,l=0,best=0,run=0;
  keys.forEach(k=>{if(marks[k]==="w"){w++;run++;best=Math.max(best,run)}else{l++;run=0}});
  let seq=0; for(let i=keys.length-1;i>=0;i--){if(marks[keys[i]]==="w")seq++;else break}
  const total=Math.round((new Date(END+"T12:00:00")-new Date(START+"T12:00:00"))/864e5)+1;
  const p=Math.max(0,100-l/total*100);
  $("sPct").textContent=p.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
  $("sPct").className="big "+(p>=90?"pos":"neg");$("sBar").style.background=p>=90?"var(--win)":"var(--loss)";
  $("sBar").style.width=p+"%";
  $("sPctTxt").textContent="Começa em 100% e cada \"errei\" tira "+(100/total).toLocaleString("pt-BR",{maximumFractionDigits:2})+"% ("+total+" dias até 17/12). "+(l?l+(l===1?" erro":" erros")+" até agora.":"Nenhum erro até agora.");
  $("sW").textContent=w;$("sL").textContent=l;$("sSeq").textContent=seq;$("sBest").textContent=best;
}
function pick(ds){sel=ds;draft=marks[ds]||null;drawCheck();drawCal()}
function drawCheck(){
  const ok=sel&&editable(sel);
  $("cTitle").textContent=sel?fmt(sel):"Check-in";
  $("bW").classList.toggle("on",draft==="w");$("bL").classList.toggle("on",draft==="l");
  ["bW","bL","bSave","bCancel"].forEach(id=>$(id).disabled=!ok);
  $("cHint").textContent= !sel?"Toque em um dia.": ok?(draft&&marks[sel]===draft?"Marcado. Dá pra trocar até o fim do dia.":draft?"Toque em Salvar para gravar.":"Escolha Acertei ou Errei."):"Dia já marcado. Só visualização.";
}
function drawCal(){
  const cal=$("cal");cal.innerHTML="";const t=today();
  let cur=new Date(+START.slice(0,4),+START.slice(5,7)-1,1,12);const end=new Date(END+"T12:00:00");
  while(cur<=end){
    const y=cur.getFullYear(),m=cur.getMonth();
    const box=document.createElement("div");box.className="month";
    box.innerHTML="<h3>"+cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+"</h3><div class='dow'><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>";
    const g=document.createElement("div");g.className="grid";
    const sd=new Date(START+"T12:00:00"), d0=(y===sd.getFullYear()&&m===sd.getMonth())?sd.getDate():1;
    for(let i=0;i<new Date(y,m,d0).getDay();i++){const b=document.createElement("div");b.className="day blank";g.appendChild(b)}
    const last=new Date(y,m+1,0).getDate();
    for(let d=d0;d<=last;d++){
      const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const b=document.createElement("button");b.type="button";b.textContent=d;
      if(ds>END)break;
      if(ds<START){b.className="day blank";g.appendChild(b);continue}
      b.className="day"+(marks[ds]==="w"?" w":marks[ds]==="l"?" l":"")+(ds===t?" today":"")+(ds===sel?" sel":"");
      if(ds>t) b.disabled=true;
      b.setAttribute("aria-label",fmt(ds)+(marks[ds]?(marks[ds]==="w"?", acertei":", errei"):""));
      b.addEventListener("click",()=>pick(ds));
      g.appendChild(b);
    }
    box.appendChild(g);cal.appendChild(box);
    cur=new Date(y,m+1,1,12);
  }
}
function render(){stats();drawCheck();drawCal()}
$("bW").onclick=()=>{draft="w";drawCheck()};
$("bL").onclick=()=>{draft="l";drawCheck()};
$("bCancel").onclick=()=>{draft=marks[sel]||null;drawCheck()};
$("bSave").onclick=async()=>{
  if(!sel||!draft||!editable(sel))return;
  marks[sel]=draft;render();
  if(db){try{await db.doc("dias/"+sel).set({r:draft});$("status").textContent="Salvo"}catch(e){$("status").textContent="Não salvou. Tente de novo."}}
  else{try{localStorage.setItem(LS,JSON.stringify(marks))}catch(e){}$("status").textContent="Salvo neste aparelho"}
};
load();sel=today()<START?START:(today()>END?END:today());draft=marks[sel]||null;render();$("status").textContent="Conectando…";
(async()=>{
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){$("status").textContent="Salvando neste aparelho";return}
  db.collection("dias").onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{const r=d.data().r;if(r==="w"||r==="l")m[d.id]=r});marks=m;
    if(sel&&!editable(sel)) draft=marks[sel]||null;
    render();$("status").textContent="Sincronizado";
  },()=>{$("status").textContent="Sem conexão com o salvamento"});
})();
</script>
</body></html>
