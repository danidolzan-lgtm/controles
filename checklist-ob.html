<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F5C7A"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="sync.js" data-app="checklist-ob"></script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.voltar{display:inline-block;margin:12px 16px 0;font:600 14px system-ui,sans-serif;color:inherit;opacity:.7;text-decoration:none}</style></head><body><a class="voltar" href="index.html">← Meus Controles</a><title>Check-list Pré-Mercado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: veredito do dia no topo, 4 perguntas por sessão, calendário seg–sex até 17/12. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --line:#D5DCDA; --fg:#16201D; --muted:#5D6B67;
  --accent:#1F5C7A; --accent-soft:#DCE9EF; --win:#1E7A4C; --win-soft:#DDF0E5; --loss:#B23A35; --loss-soft:#F6E0DE; --part:#C08A1E; --part-soft:#F5EBD6;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201E; --line:#2A3532; --fg:#E4ECE9; --muted:#93A29E; --accent:#6FB2D3; --accent-soft:#1B3240;
  --win:#5BC98E; --win-soft:#173327; --loss:#EC7A73; --loss-soft:#3A1E1C; --part:#E2B457; --part-soft:#3A2F17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201E; --line:#2A3532; --fg:#E4ECE9; --muted:#93A29E; --accent:#6FB2D3; --accent-soft:#1B3240;
  --win:#5BC98E; --win-soft:#173327; --loss:#EC7A73; --loss-soft:#3A1E1C; --part:#E2B457; --part-soft:#3A2F17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0}
h2::first-letter{text-transform:uppercase}
.sub,.status{color:var(--muted);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.tabs{display:flex;gap:6px}
.tabs button{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 14px;cursor:pointer;flex:1}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tabs .h{display:block;font-family:var(--f-num);font-weight:400;font-size:.75rem;opacity:.8}
.q{display:grid;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.q p{margin:0;max-width:60ch}
.yn{display:flex;gap:6px}
.yn button{appearance:none;font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;padding:8px 18px;cursor:pointer}
.yn button.on.s{background:var(--win);border-color:var(--win);color:var(--surface)}
.yn button.on.n{background:var(--loss);border-color:var(--loss);color:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[disabled]{cursor:default}
.verdict{border-radius:9px;padding:14px;display:grid;gap:2px;background:var(--bg)}
.verdict b{font-family:var(--f-display);font-size:1.3rem}
.verdict.ok{background:var(--win-soft)} .verdict.ok b{color:var(--win)}
.verdict.no{background:var(--loss-soft)} .verdict.no b{color:var(--loss)}
.verdict span{font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:7px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.month{display:grid;gap:8px}
.month h3{font-family:var(--f-display);font-size:.95rem;margin:0}
.month h3::first-letter{text-transform:uppercase}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{font-size:.68rem;color:var(--muted);text-align:center;text-transform:uppercase}
.day{appearance:none;font:inherit;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:7px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-family:var(--f-num);font-size:.85rem;cursor:pointer;position:relative}
.day.blank{visibility:hidden}
.day.we{opacity:.35;cursor:default}
.day.full{background:var(--win);border-color:var(--win);color:var(--surface)}
.day.half{background:var(--part-soft);border-color:var(--part)}
.day.none{background:var(--loss-soft);border-color:var(--loss)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--accent) inset}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.lock{font-size:.82rem;color:var(--muted);font-style:italic}
</style>
<div class="wrap">
  <div class="top">
    <div><h1>Check-list Pré-Mercado</h1><div class="sub">Responda antes de cada sessão. Quatro "sim" liberam a operação.</div></div>
    <div class="status" id="status">Carregando…</div>
  </div>
  <div class="panel">
    <h2 id="dTitle">Hoje</h2>
    <div class="tabs" id="tabs"></div>
    <div id="qs"></div>
    <div class="verdict" id="verdict"></div>
    <div class="lock" id="lock" hidden></div>
    <div class="actions" id="acts"><button type="button" class="btn primary" id="bSave">Salvar</button><button type="button" class="btn" id="bCancel">Fechar sem salvar</button></div>
  </div>
  <div class="panel">
    <div id="cal" style="display:grid;gap:18px"></div>
    <div class="legend"><span><i style="background:var(--win)"></i>2 sessões liberadas</span><span><i style="background:var(--part-soft)"></i>1 sessão liberada</span><span><i style="background:var(--loss-soft)"></i>não liberado</span></div>
  </div>
</div>
<script>
const START="2026-10-07", END="2026-12-17", LS="checklistOB.v1";
const SESS=[{id:"manha",nome:"Manhã",h:"09:00–11:30"},{id:"tarde",nome:"Tarde",h:"14:00–16:30"}];
const QS=[
  {id:"hor",k:"Horário",t:"Estou dentro da janela da sessão e sem notícia forte nos próximos minutos?"},
  {id:"op",k:"Operacional",t:"Vou entrar só em Virada, Respiro ou Muralha, com as médias 9, 21 e 50 alinhadas e a vela do sinal fechada?"},
  {id:"ger",k:"Gerenciamento",t:"Mão base definida, Soros nível 1, no máximo 2 entradas, e encerro a sessão se a 1ª der loss?"},
  {id:"men",k:"Mentalidade",t:"Estou calmo, sem vontade de recuperar nada, e aceito o stop se ele vier?"}
];
let data={}, db=null, sel=null, sess="manha", draft=null;
const $=id=>document.getElementById(id);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const fmt=ds=>new Date(ds+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"});
const isWE=ds=>{const g=new Date(ds+"T12:00:00").getDay();return g===0||g===6};
const ok=s=>s&&QS.every(q=>s[q.id]===true);
const editable=ds=>ds===today();
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r)data=r}catch(e){}}
function pick(ds){sel=ds;draft=JSON.parse(JSON.stringify(data[ds]||{}));render()}
function render(){
  $("dTitle").textContent=fmt(sel);
  const t=$("tabs");t.innerHTML="";
  SESS.forEach(s=>{const b=document.createElement("button");b.type="button";b.className=s.id===sess?"on":"";b.innerHTML=s.nome+"<span class='h'>"+s.h+"</span>";b.onclick=()=>{sess=s.id;render()};t.appendChild(b)});
  const can=editable(sel), cur=(draft[sess]||{});
  const box=$("qs");box.innerHTML="";
  QS.forEach(q=>{
    const d=document.createElement("div");d.className="q";
    d.innerHTML="<span class='k'>"+q.k+"</span><p>"+q.t+"</p>";
    const yn=document.createElement("div");yn.className="yn";
    [["s","Sim",true],["n","Não",false]].forEach(([c,l,v])=>{
      const b=document.createElement("button");b.type="button";b.textContent=l;b.className=c+(cur[q.id]===v?" on":"");b.disabled=!can;
      b.setAttribute("aria-pressed",cur[q.id]===v);
      b.onclick=()=>{draft[sess]=Object.assign({},draft[sess]||{},{[q.id]:v});render()};
      yn.appendChild(b)});
    d.appendChild(yn);box.appendChild(d);
  });
  const v=$("verdict"), answered=QS.every(q=>typeof cur[q.id]==="boolean");
  if(ok(cur)){v.className="verdict ok";v.innerHTML="<b>Liberado para operar</b><span>Sessão da "+(sess==="manha"?"manhã":"tarde")+". Siga o manual: 2 entradas no máximo.</span>"}
  else if(answered){v.className="verdict no";v.innerHTML="<b>Não operar nesta sessão</b><span>Algum item ficou em não. Fecha a corretora e volta na próxima sessão.</span>"}
  else{v.className="verdict";v.innerHTML="<b>Responda as 4 perguntas</b><span>Quatro sim liberam a sessão.</span>"}
  $("acts").hidden=!can; $("lock").hidden=can;
  $("lock").textContent= sel<today()?"Dia encerrado. Só visualização.":"Esse dia ainda não chegou. O check-in abre no próprio dia.";
  drawCal();
}
function drawCal(){
  const cal=$("cal");cal.innerHTML="";const t=today();
  let cur=new Date(2026,9,1,12);const end=new Date(END+"T12:00:00");
  while(cur<=end){
    const y=cur.getFullYear(),m=cur.getMonth();
    const box=document.createElement("div");box.className="month";
    box.innerHTML="<h3>"+cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+"</h3><div class='dow'><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>";
    const g=document.createElement("div");g.className="grid";
    for(let i=0;i<new Date(y,m,1).getDay();i++){const b=document.createElement("div");b.className="day blank";g.appendChild(b)}
    for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
      const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const b=document.createElement("button");b.type="button";b.textContent=d;
      if(ds>END)break;
      if(ds<START){b.className="day blank";g.appendChild(b);continue}
      const rec=data[ds], n=rec?SESS.filter(s=>ok(rec[s.id])).length:0;
      let cls="day";
      if(isWE(ds)){cls+=" we";b.disabled=true}
      else if(rec&&Object.keys(rec).length) cls+= n===2?" full":n===1?" half":" none";
      if(ds===t)cls+=" today"; if(ds===sel)cls+=" sel";
      b.className=cls; b.setAttribute("aria-label",fmt(ds));
      if(!isWE(ds)) b.onclick=()=>pick(ds);
      g.appendChild(b);
    }
    box.appendChild(g);cal.appendChild(box);
    cur=new Date(y,m+1,1,12);
  }
}
$("bCancel").onclick=()=>pick(sel);
$("bSave").onclick=async()=>{
  if(!editable(sel))return;
  data[sel]=JSON.parse(JSON.stringify(draft));render();
  if(db){try{await db.doc("dias/"+sel).set(data[sel]);$("status").textContent="Salvo"}catch(e){$("status").textContent="Não salvou. Tente de novo."}}
  else{try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}$("status").textContent="Salvo neste aparelho"}
};
load();
{const t=today();sel=t<START?START:t>END?END:t;if(new Date().getHours()>=13)sess="tarde"}
draft=JSON.parse(JSON.stringify(data[sel]||{}));render();$("status").textContent="Conectando…";
(async()=>{
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){$("status").textContent="Salvando neste aparelho";return}
  db.collection("dias").onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=d.data()});data=m;
    if(!editable(sel)) draft=JSON.parse(JSON.stringify(data[sel]||{}));
    else if(!Object.keys(draft).length) draft=JSON.parse(JSON.stringify(data[sel]||{}));
    render();$("status").textContent="Sincronizado";
  },()=>{$("status").textContent="Sem conexão com o salvamento"});
})();
</script>
</body></html>
