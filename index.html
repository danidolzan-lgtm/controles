<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Controles</title>
<meta name="theme-color" content="#2563EB"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="sync.js" data-app="geral" data-show-user="1"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF3FC;--surface:#FFFFFF;--line:#DDE4F2;--fg:#13203B;--muted:#58668A;--accent:#2563EB;--gc:#2563EB;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0B1220;--surface:#16213A;--line:#2A3A5C;--fg:#E6EDFA;--muted:#9AA9C7;--accent:#60A5FA;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background-color .3s;min-height:100dvh;background-attachment:fixed!important}
html[data-g] body{background-image:radial-gradient(1000px 520px at 0% -10%,color-mix(in srgb,var(--gc) 22%,transparent),transparent 62%),radial-gradient(900px 460px at 100% 0%,color-mix(in srgb,var(--gc) 12%,transparent),transparent 60%)!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
.wrap>*{min-width:0}
[hidden]{display:none!important}
h1{font-family:var(--f-display);font-weight:800;font-size:1.8rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* tela inicial: os 3 módulos no meio */
.home{min-height:calc(100dvh - 150px);display:grid;align-content:center;gap:22px;text-align:center}
.mods{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.mods{grid-template-columns:minmax(0,1fr)}.home{text-align:left;min-height:calc(100dvh - 120px)}}
.mod{--gc:#2563EB;appearance:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--surface);display:grid;gap:14px;box-shadow:0 14px 30px -22px var(--gc);transition:transform .16s ease,box-shadow .16s,border-color .16s;animation:up .35s ease both}
.mod:nth-child(2){animation-delay:.05s}.mod:nth-child(3){animation-delay:.1s}
.mod::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 24%,transparent),transparent 70%);pointer-events:none}
.mod:hover,.mod:focus-visible{transform:translateY(-4px);border-color:color-mix(in srgb,var(--gc) 50%,transparent);box-shadow:0 20px 36px -20px var(--gc);outline:none}
.mod .gi{position:relative;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;font:800 1.1rem var(--f-display);background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#7C3AED));box-shadow:0 10px 20px -8px var(--gc)}
.mod b{position:relative;font:800 1.3rem var(--f-display)}
.mod small{position:relative;color:var(--muted);font-size:.85rem}
.mod .go{position:relative;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem;color:var(--gc)}
.mod .go i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 14%,transparent)}
@media (max-width:760px){.mod{grid-template-columns:auto minmax(0,1fr);align-items:center;padding:16px;gap:4px 14px}.mod .gi{grid-row:1 / span 2;width:50px;height:50px}.mod .go{grid-column:1/-1;margin-top:8px}}
/* dentro de um módulo */
.bar{position:sticky;top:calc(var(--site-h,58px) + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.btn-home{appearance:none;font:600 .92rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-home:hover{border-color:var(--gc);color:var(--gc)}
.btn-home svg{width:18px;height:18px}
.gh{display:flex;align-items:center;gap:14px;animation:up .3s ease both}
.gh .gi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;font:800 1rem var(--f-display);background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#7C3AED));box-shadow:0 10px 20px -8px var(--gc);flex:none}
.gh h1{background:linear-gradient(90deg,var(--gc),color-mix(in srgb,var(--gc) 50%,#7C3AED));-webkit-background-clip:text;background-clip:text;color:transparent!important}
h2{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 0}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr;gap:10px}}
a.tile{display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--fg);background:color-mix(in srgb,var(--gc) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--gc) 16%,var(--line));border-radius:16px;padding:16px;box-shadow:0 10px 22px -20px var(--gc);transition:transform .14s ease,box-shadow .14s,border-color .14s;animation:up .3s ease both}
a.tile:hover,a.tile:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gc) 50%,transparent);box-shadow:0 16px 28px -16px var(--gc);outline:none}
a.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 16%,transparent);color:var(--gc)}
a.tile .ic svg{width:22px;height:22px}
a.tile b{font:800 1.02rem var(--f-display)}
a.tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
@media (max-width:560px){a.tile{padding:12px;gap:8px}a.tile .ic{width:36px;height:36px}}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
a.lnk{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
a.lnk:hover{border-color:var(--gc)}
a.lnk b{font-weight:600}a.lnk span{color:var(--muted);font-size:.8rem;display:block}
a.lnk .ar{margin-left:auto;color:var(--gc);font-weight:700}
</style></head><body>
<div class="wrap">
  <section class="home" id="home">
    <div><h1>Meus Controles</h1><p class="sub">Escolha o módulo. Seus dados ficam salvos na sua conta e aparecem iguais no celular e no PC.</p></div>
    <div class="mods" id="mods"></div>
    <div id="acctSlot" style="max-width:520px;width:100%;justify-self:center"></div>
  </section>
  <section id="grupo" hidden style="display:grid;gap:16px">
    <div class="bar"><button type="button" class="btn-home" id="bHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Menu principal</button></div>
    <div class="gh"><span class="gi" id="gIc"></span><div><h1 id="gTit"></h1><p class="sub" id="gSub"></p></div></div>
    <div class="tiles" id="tiles"></div>
    <div id="links"></div>
  </section>
</div>
<script>
(function(){
  const MC=window.__MC||{GROUPS:[],ICO:{},DESC:{}};
  const SUB={ob:"Quotex · M1 · os 5 operacionais",b3:"Mini índice e mini dólar",pes:"Rotina, casa e finanças"};
  const LINKS={
    ob:[["https://quotex.com/pt/trade","Quotex","Corretora · operar"],["https://br.investing.com/economic-calendar","Notícias","Calendário econômico (Investing)"],["analise-ob.html#cfgBox","Claude · conversa OB","Prints e dúvidas de OB","analiseOB.claudeUrl"]],
    b3:[["https://br.investing.com/economic-calendar","Notícias","Calendário econômico (Investing)"],["analise-b3.html#cfgBox","Claude · conversa B3","Prints e dúvidas de B3","analiseB3.claudeUrl"]]};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const sigla=g=>g.s==="Pessoal"?"EU":g.s;
  const $=id=>document.getElementById(id);
  $("mods").innerHTML=MC.GROUPS.map(g=>"<button type='button' class='mod' data-k='"+g.k+"' style='--gc:"+g.c+"'><span class='gi'>"+esc(sigla(g))+"</span><b>"+esc(g.g)+"</b><small>"+esc(SUB[g.k]||"")+" · "+g.items.length+" páginas</small><span class='go'>Abrir<i>→</i></span></button>").join("");
  function abrir(k){
    const g=MC.GROUPS.find(x=>x.k===k);
    if(!g){document.documentElement.removeAttribute("data-g");document.documentElement.style.removeProperty("--gc");$("home").hidden=false;$("grupo").hidden=true;try{sessionStorage.removeItem("index.tab")}catch(e){}return}
    document.documentElement.setAttribute("data-g",k);document.documentElement.style.setProperty("--gc",g.c);
    $("home").hidden=true;$("grupo").hidden=false;
    $("gIc").textContent=sigla(g);$("gTit").textContent=g.g;$("gSub").textContent=(SUB[k]||"")+" · "+g.items.length+" páginas";
    $("tiles").innerHTML=g.items.map((it,i)=>"<a class='tile' href='"+it[0]+".html' style='animation-delay:"+(i*.03)+"s'><span class='ic'>"+(MC.ICO[it[1]]||"")+"</span><span><b>"+esc(it[1])+"</b><br><small>"+esc(MC.DESC[it[0]]||"")+"</small></span></a>").join("");
    const L=LINKS[k]||[];
    $("links").innerHTML=L.length?"<h2>Links</h2><div class='links' style='margin-top:10px'>"+L.map(l=>{let u=l[0],ext=/^https?:/.test(u),sp=l[2];
      if(l[3]){let s="";try{s=localStorage.getItem(l[3])||""}catch(e){}if(s){u=s;ext=true}else sp="Configure na Análise de entrada"}
      return "<a class='lnk' href='"+esc(u)+"'"+(ext?" target='_blank' rel='noopener'":"")+"><span><b>"+esc(l[1])+"</b><span>"+esc(sp)+"</span></span><span class='ar'>"+(ext?"↗":"→")+"</span></a>"}).join("")+"</div>":"";
    try{sessionStorage.setItem("index.tab",k)}catch(e){}
    window.scrollTo({top:0});
  }
  $("mods").addEventListener("click",e=>{const b=e.target.closest(".mod");if(b)abrir(b.dataset.k)});
  $("bHome").addEventListener("click",()=>abrir(null));
  let t=null;try{t=sessionStorage.getItem("index.tab")}catch(e){}
  if(location.hash==="#inicio"){t=null;history.replaceState(null,"",location.pathname)}
  abrir(t);
  window.addEventListener("hashchange",()=>{if(location.hash==="#inicio"){history.replaceState(null,"",location.pathname);abrir(null)}});
})();
</script>
</body></html>
